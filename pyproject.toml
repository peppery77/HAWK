[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hawk-vlm"
version = "0.1.0"
description = "Training-free head importance-aware visual-token pruning for Qwen2.5-VL"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Qihui Zhu"},
  {name = "Tao Zhang"},
  {name = "Yuchen Wang"},
  {name = "Zijian Wen"},
  {name = "Mengjie Zhang"},
  {name = "Shuangwu Chen"},
  {name = "Xiaobin Tan"},
  {name = "Jian Yang"},
  {name = "Yang Liu"},
  {name = "Zhenhua Dong"},
  {name = "Xianzhi Yu"},
  {name = "Yinfei Pan"},
]
dependencies = [
  "torch>=2.5",
  "transformers==4.52.0",
  "tokenizers==0.21.1",
  "huggingface-hub==0.31.4",
  "qwen-vl-utils==0.0.11",
  "accelerate>=1.4",
  "Pillow>=9.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11"]
eval = [
  "datasets==3.6.0",
  "ms-vlmeval==0.0.18",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "pyarrow>=17",
  "xlsxwriter>=3.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"
